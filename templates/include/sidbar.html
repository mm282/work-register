<div class="col-lg-4">
    <div class="sidebar">
        <div class="row">
            <div class="col-lg-12">
                <div class="sidebar-item search">
                    <form id="search_form" name="gs" method="GET" action="{% url 'post:search' %}">
                        <input type="text" name="q" class="searchText" placeholder=" search..."
                               autocomplete="on">
                    </form>
                </div>
            </div>
            <div class="col-lg-12">
                <div class="sidebar-item recent-posts">
                    <div class="sidebar-heading">
                        <h2>Recent Posts</h2>
                    </div>
                    <div class="content">
                        {% for item in sidbar_articles %}
                        <ul>
                            <li><a href="{% url 'post:detail' item.id %}">
                                <h5>{{ item.name }}</h5>
                                <span>{{ item.date }}</span>
                            </a></li>

                        </ul>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
      
            </div>
            <div class="col-lg-12">
                <div class="sidebar-item tags">
                    <div class="sidebar-heading">
                        <h2>Tag Clouds</h2>
                    </div>
                    <div class="content">
                        <ul>
                            <li><a href="#">Django</a></li>
                            <li><a href="#">Backend</a></li>
                            <li><a href="#">Python</a></li>
                            <li><a href="#">frontend</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
